; llama-server router presets for the three live models in C:\cmodels
;
; Used by start_router.bat:  llama-server --models-preset models.ini --models-max 1
; The section name IS the model id that pi and the board request in the
; OpenAI "model" field. Keys are command-line args without leading dashes.
;
; Precedence: router CLI args > model section > [*] global.
; Reserved args (host, port, api-key, alias, models-*) are stripped or
; overwritten by the router and must not be set here.
;
; Values carried over from model_args.json, minus its corruption:
;   - BigBang had "--cache-reuse 256--no-direct-io" (missing space), which
;     swallowed the flag and left direct-io enabled. Intent restored below.
;   - Aliases were double-escaped (\"kat-apex-q\"); section names replace them.

version = 1

[*]
jinja           = true
flash-attn      = on
prio            = 2
prio-batch      = 2
n-predict       = 16000
slot-save-path  = cache
cache-reuse     = 256
cache-ram       = -1
direct-io       = false
top-k           = 20
top-p           = 0.95
log-timestamps  = true
log-colors      = auto
verbosity       = 4

; ---------------------------------------------------------------- coding ---
[kat]
model              = C:\cmodels\KAT-Coder-V2.5-Dev-APEX-Balanced.gguf
gpu-layers         = all
n-cpu-moe          = 39
ctx-size           = 95000
parallel           = 1
threads            = 6
poll               = 0
fit                = off
batch-size         = 4096
ubatch-size        = 4096
cpu-mask           = 0x555
cpu-mask-batch     = 0x555
cpu-strict         = 1
ctx-checkpoints    = 32
sse-ping-interval  = -1
cache-type-k       = q8_0
cache-type-v       = q8_0
kv-offload         = true
kv-unified         = true
warmup             = true
reasoning          = on
reasoning-format   = deepseek
reasoning-temp     = 0.8
chat-template-file = C:\cmodels\chat_template.jinja
chat-template-kwargs = {"enable_thinking":true,"preserve_thinking":true}
temp               = 0.4
min-p              = 0
presence-penalty   = 1.5
load-on-startup    = false

; ------------------------------------------- orchestration / research ------
[bigbang]
model              = C:\cmodels\BigBang-v1.i1-Q5_K_M.gguf
gpu-layers         = all
n-cpu-moe          = 38
ctx-size           = 95000
parallel           = 1
threads            = 6
poll               = 0
fit                = off
batch-size         = 4096
ubatch-size        = 4096
cpu-mask           = 0x555
cpu-mask-batch     = 0x555
cpu-strict         = 1
ctx-checkpoints    = 32
sse-ping-interval  = -1
cache-type-k       = q8_0
cache-type-v       = q8_0
kv-offload         = true
reasoning-temp     = 1.0
chat-template-file = C:\cmodels\chat_template.jinja
temp               = 0.6
min-p              = 0
load-on-startup    = true

; ------------------------------------------------ small parallel tasks -----
[bonsai]
model              = C:\cmodels\Bonsai-27B-Q1_0.gguf
gpu-layers         = 99
ctx-size           = 55000
parallel           = 4
poll               = 50
ctx-checkpoints    = 8
cache-type-k       = q4_0
cache-type-v       = q4_0
kv-unified         = true
reasoning          = on
reasoning-temp     = 1.0
chat-template-kwargs = {"enable_thinking":true,"preserve_thinking":true}
temp               = 0.6
repeat-penalty     = 1.15
load-on-startup    = false
